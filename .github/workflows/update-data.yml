name: Update market data

on:
  schedule:
    - cron: "*/15 4-10 * * 1-5"   # every 15 min, about 09:30-16:30 IST on weekdays (quick refresh)
    - cron: "30 12 * * 1-5"       # 18:00 IST on weekdays (full refresh)
  push:
    paths: ["watchlist.json", "funds_meta.json", "fetch_data.py"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        run: |
          if [ "${{ github.event.schedule }}" = "*/15 4-10 * * 1-5" ]; then
            python fetch_data.py --fast
          else
            python fetch_data.py --eod
          fi
      - name: Save data
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add market.json delivery.json
          git diff --cached --quiet || (git commit -m "Update market data" && git pull --rebase && git push)
